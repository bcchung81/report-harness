# CI — 로컬에서만 초록인 테스트를 구조적으로 차단한다.
# fresh clone 상태(report/·form/·dist/ 없음)에서 pytest 전량 + 배포 가드 + 웹앱 빌드를 돌린다.

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 옛 시드 판본 갱신 테스트(test_sync_rules)가 git 이력을 읽는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 런타임 스크립트는 표준 라이브러리만 쓴다 — 설치하는 것은 테스트 러너 pytest 하나뿐이다.
      # 종전에는 이 설치까지 빼 러너에 pytest가 없어 '26.8월부터 CI가 매번 실패했다('26.9.25 발견).
      - name: 테스트 러너 설치 (pytest만)
        run: python3 -m pip install --quiet pytest
      - name: pytest (런타임 의존성 설치 없음)
        run: python3 -m pytest -q -ra
      - name: 배포 가드 (금지 폴더·PII)
        run: bash scripts/package_check.sh
      - name: 웹앱 스킬 빌드 검증 (6기준 + 드리프트)
        run: python3 scripts/build_webapp_skill.py --target all
